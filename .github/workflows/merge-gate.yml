# Reusable: the factory's two merge gate checks, posted as commit statuses
# `factory/red-green` and `factory/test-integrity` so a target can require
# them by name. Called from a target repo's thin factory workflow on
# `pull_request` and on `merge_group`, the merge queue's request for the
# required checks on a candidate rebased onto the latest main (#344).
#
# One job answers both. This workflow has no `on:` of its own beyond
# `workflow_call`, so it runs on whatever event reached the caller, and
# factory/merge-gate/gate-subject.ts reads the pull request number, the head
# and the base branch off that event. Nothing below knows which it was, which
# is what makes green mean the same thing on a queued candidate as on the pull
# request it came from.
#
# No agent runs here; the decisions are pure functions in
# factory/merge-gate, the script only gathers the diff and the linked ticket body.
name: factory merge gate

on:
  workflow_call:
    inputs:
      test_command:
        description: Command that runs the one changed test file passed as its argument, from the target's root. Called once per changed test file, so a failure names that file alone.
        type: string
        default: node --test
      install_command:
        description: Command run in each checkout before the tests. Empty skips it.
        type: string
        default: npm ci
      node_version:
        description: The Node the target's own tests and tooling run on. Match the target's own CI.
        type: string
        default: "22"
      factory_repo:
        description: Repo holding the factory scripts (this repo).
        type: string
        default: chizhangucb/tomte
      factory_ref:
        description: Ref of the factory scripts to run. Keep it equal to the ref in the caller's `uses:`; GitHub does not expose that ref to the called workflow.
        type: string
        default: main
    secrets:
      FACTORY_PAT:
        required: true

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write

    env:
      # The head the statuses go on, needed before anything is checked out, which is
      # earlier than gate-subject.ts can run. It is the one value read off the payload
      # here; the paths are HEAD_SHA_PATHS in that module, and its test pins this line
      # to them. The pull request number and the base branch are read there instead,
      # since a merge_group payload spells both of them differently.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mark both checks pending
        run: |
          # runner.temp is not available in job-level env
          echo "OUTPUT_DIR=$RUNNER_TEMP/factory-out" >> "$GITHUB_ENV"
          for ctx in factory/red-green factory/test-integrity; do
            gh api --method POST "repos/{owner}/{repo}/statuses/$HEAD_SHA" \
              -f state=pending -f context="$ctx" -f target_url="$RUN_URL" -f description="running" >/dev/null
          done

      - name: Checkout the head under judgment
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          path: target

      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install factory
        working-directory: factory
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run merge gate checks
        working-directory: target
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: tsx ../factory/factory/merge-gate/merge-gate.ts

      - name: Post statuses
        if: always()
        run: |
          set -euo pipefail
          post() {
            gh api --method POST "repos/{owner}/{repo}/statuses/$HEAD_SHA" \
              -f state="$2" -f context="$1" -f target_url="$RUN_URL" -f description="$(printf '%s' "$3" | cut -c1-140)" >/dev/null
            echo "$1: $2 ($3)"
          }
          if [ ! -f "$OUTPUT_DIR/merge-gate.json" ]; then
            post factory/red-green error "merge gate did not run; see the workflow log"
            post factory/test-integrity error "merge gate did not run; see the workflow log"
            exit 0
          fi
          for key in redGreen:factory/red-green testIntegrity:factory/test-integrity; do
            field="${key%%:*}"; ctx="${key#*:}"
            ok=$(jq -r ".$field.ok" "$OUTPUT_DIR/merge-gate.json")
            if [ "$ok" = "true" ]; then
              # detail before plan.reason: a passing red-green names the files it could not
              # run, and that sentence is the only one a maintainer sees without opening the run.
              post "$ctx" success "$(jq -r "[.$field.detail, .$field.plan.reason, \"clean\"] | map(select(. != null and . != \"\")) | first" "$OUTPUT_DIR/merge-gate.json")"
            else
              post "$ctx" failure "$(jq -r ".$field.reasons[0]" "$OUTPUT_DIR/merge-gate.json")"
            fi
          done

      - name: Upload merge gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Keyed on the head rather than the pull request number: a queued candidate is a
          # different commit of the same pull request, and the two must not collide.
          name: factory-merge-gate-${{ env.HEAD_SHA }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out
          if-no-files-found: ignore

      - name: Fail the job when a check failed
        run: jq -e '.redGreen.ok and .testIntegrity.ok' "$OUTPUT_DIR/merge-gate.json" >/dev/null
