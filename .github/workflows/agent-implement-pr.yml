# Reusable: address review feedback on a PR labeled agent:implement.
# Called from a target repo's thin factory workflow on `pull_request_target: labeled`.
# Vendored from sandcastle's agent-implement-pr.yml (v0.12.0), edited for the factory.
name: Agent Implement PR

on:
  workflow_call:
    inputs:
      implementer_model:
        description: Default model for the implementer. A model:<name> label on the PR's linked ticket overrides it for that run.
        type: string
        default: claude-opus-5
      trusted_author_associations:
        description: >-
          Comma-separated GitHub author_association values whose words the factory acts on
          (OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR, NONE). PR comments, review threads and the linked ticket's comments from anyone else are dropped
          before the agent reads them, with a count in their place. The retry marker this run reads
          back is a comment the factory posted with FACTORY_PAT, so it follows this same policy.
          Keep it equal to the dispatch and implement jobs; setting it widens all of it together.
          Empty falls back to OWNER; a payload with no association reads as NONE.
        type: string
        default: OWNER
      node_version:
        description: The Node the target's own tests and tooling run on. Match the target's own CI.
        type: string
        default: "22"
      factory_repo:
        description: Repo holding the factory scripts (this repo).
        type: string
        default: chizhangucb/tomte
      factory_ref:
        description: Ref of the factory scripts to run. Keep it equal to the ref in the caller's `uses:`; GitHub does not expose that ref to the called workflow.
        type: string
        default: main
    secrets:
      FACTORY_PAT:
        required: true

jobs:
  refuse-fork:
    # pull_request_target runs with secrets: the factory never runs a fork's code. Say so on the PR
    # and drop the trigger label, instead of skipping in silence. No story asked for this job; it
    # stays because reverting it would open the hole, not close a rewrite (#47).
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LABEL: agent:implement
    steps:
      - run: |
          gh pr edit "$PR_NUMBER" --remove-label "$LABEL" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run: the factory does not run on PRs from forks (\`$LABEL\` removed). Push the branch to this repo instead."

  implement-pr:
    # pull_request_target runs with secrets: never on a fork's code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Keyed on the subject, this run's PR, and the role is not part of the key, so
      # this run never edits a branch a review run is reading (#149). Unrelated
      # subjects never share a key, so nothing waits behind a run it has nothing to
      # do with, and the older run is never cancelled: it is doing real work.
      # ADR 0004's 2026-09-10 amendment carries the reasoning and the trade-off.
      group: factory-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    outputs:
      # Everything the `retry` job needs from this one. That job runs on its own
      # runner, so nothing it reads is here for free (#51). The PR's head branch comes
      # straight off the event, so it is not repeated here.
      handle: ${{ steps.transition.outputs.handle }}
      outcome: ${{ steps.run.outcome }}
      reason: ${{ steps.handoff.outputs.reason }}
      rate_limited: ${{ steps.handoff.outputs.rate_limited }}
    permissions:
      contents: write
      issues: read # the linked ticket, its retry marker, and its labels
      pull-requests: write
      actions: read # the retry handler links the uploaded run log (#16)

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # The push step puts FACTORY_PAT in front of it; the agent never sees the token.
      PUSH_URL: ${{ github.server_url }}/${{ github.repository }}.git

    steps:
      - name: Refuse closed PR
        if: github.event.pull_request.state != 'open'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run: PR #${PR_NUMBER} is not open."

      - name: Transition labels
        if: github.event.pull_request.state == 'open'
        id: transition
        run: |
          set -euo pipefail
          # The retry job's condition: this run took the PR, so it owes it a retry or a comment (#51).
          # Written first, so a label call that fails still fails the step and still reaches the handler.
          echo "handle=true" >> "$GITHUB_OUTPUT"
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Enumerate accounts
        # One secret per account, CLAUDE_CODE_OAUTH_TOKEN_<n>, labeled by the CLAUDE_ACCOUNT_<n> variable.
        # Every token is masked before anything else prints. The list goes to a file in RUNNER_TEMP for
        # the run script, which picks the account, deletes the file, and rotates once on a rate limit
        # (#17). Adding an account is adding one secret; nothing here changes.
        if: github.event.pull_request.state == 'open'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$")) | .value' <<<"$SECRETS_JSON" \
            | while IFS= read -r token; do echo "::add-mask::$token"; done
          file="${RUNNER_TEMP}/factory-accounts.json"
          jq -n --argjson secrets "$SECRETS_JSON" --argjson vars "$VARS_JSON" '
            [ $secrets | to_entries[]
              | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$"))
              | (.key | sub("^CLAUDE_CODE_OAUTH_TOKEN_"; "") | tonumber) as $n
              | ($vars["CLAUDE_ACCOUNT_\($n)"] // "") as $label
              | { index: $n, label: (if ($label | length) > 0 then $label else "account-\($n)" end), token: .value } ]
            | sort_by(.index)' > "$file"
          chmod 600 "$file"
          count=$(jq 'length' "$file")
          if [ "$count" = "0" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN_<n> secret is available. Pass secrets: inherit from the caller." >&2
            exit 1
          fi
          echo "FACTORY_ACCOUNTS_FILE=$file" >> "$GITHUB_ENV"
          echo "$count account(s) configured: $(jq -r '[.[] | "\(.index)"] | join(", ")' "$file")"

      - name: Checkout PR branch
        if: github.event.pull_request.state == 'open'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Checkout factory
        if: github.event.pull_request.state == 'open'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Prepare branch
        if: github.event.pull_request.state == 'open'
        working-directory: target
        run: |
          # fetch-depth 0 already brought origin/main; no credentials remain for a network fetch
          git branch -f main origin/main
          git checkout -B "$BRANCH" "$BRANCH_HEAD_SHA"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js
        if: github.event.pull_request.state == 'open'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install factory (pinned sandcastle, tsx, Claude Code)
        # One step for his three: the CLI is pinned in the factory's lockfile, not `npm i -g` (#21).
        if: github.event.pull_request.state == 'open'
        working-directory: factory
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "Claude Code $(node_modules/.bin/claude --version)"

      - name: Run implement-PR agent
        if: github.event.pull_request.state == 'open'
        id: run
        working-directory: target
        env:
          IMPLEMENTER_MODEL: ${{ inputs.implementer_model }}
          TRUSTED_AUTHOR_ASSOCIATIONS: ${{ inputs.trusted_author_associations }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tsx ../factory/factory/agent-workflows/implement-pr/implement-pr.ts

      - name: Post usage comment
        # Token usage and wall time of every attempt in this job, one comment per role (#18).
        if: always() && github.event.pull_request.state == 'open'
        run: bash factory/factory/lib/upsert-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/factory-out/usage-implementer.md"

      - name: Upload run log
        if: always() && github.event.pull_request.state == 'open'
        uses: actions/upload-artifact@v4
        with:
          name: factory-implement-pr-${{ github.event.pull_request.number }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out/logs
          if-no-files-found: ignore

      - name: Push branch
        # refs/heads/$BRANCH, not HEAD: the branch the run collected commits on, whatever the agent left checked out.
        if: github.event.pull_request.state == 'open' && success()
        working-directory: target
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
        run: |
          if [ "$(cat "${RUNNER_TEMP}/factory-out/has_commits.txt")" != "true" ]; then
            echo "No commits to push."
            exit 0
          fi
          if ! git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" "https://x-access-token:${FACTORY_PAT}@${PUSH_URL#*://}" "refs/heads/$BRANCH:refs/heads/$BRANCH" 2> push_err.txt; then
            cat push_err.txt
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement-PR run." > "${RUNNER_TEMP}/factory-out/failure_reason.txt"
            fi
            exit 1
          fi

      - name: Post thread replies
        if: github.event.pull_request.state == 'open' && success()
        env:
          REPLIES: ${{ runner.temp }}/factory-out/implement_thread_replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Post inline comments
        if: github.event.pull_request.state == 'open' && success()
        working-directory: target
        env:
          COMMENTS: ${{ runner.temp }}/factory-out/implement_new_inline_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          for i in $(seq 0 $((count - 1))); do
            path=$(jq -r ".[$i].path" "$COMMENTS")
            line=$(jq -r ".[$i].line" "$COMMENTS")
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments" \
              -f commit_id="$head_sha" \
              -f path="$path" \
              -F line="$line" \
              -f side="RIGHT" \
              -f body="$body"
          done

      - name: Post top-level comments
        if: github.event.pull_request.state == 'open' && success()
        env:
          COMMENTS: ${{ runner.temp }}/factory-out/implement_top_level_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh pr comment "$PR_NUMBER" --body "$body"
          done

      - name: Request review
        # The factory's loop: every push is judged again. FACTORY_PAT so the label fires its event.
        if: github.event.pull_request.state == 'open' && success()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: gh pr edit "$PR_NUMBER" --add-label "agent:review"

      - name: Collect the retry handoff
        # What the `retry` job cannot read off this runner: the failure reason the run wrote
        # and the marker that says every account was rate limited. The run log travels in the
        # uploaded artifact instead. always(), because a `timeout-minutes` kill cancels this
        # job and failure() would skip it (#51).
        if: always() && github.event.pull_request.state == 'open'
        id: handoff
        env:
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
        run: |
          set -euo pipefail
          {
            echo "reason<<FACTORY_HANDOFF_EOF"
            # A reason line equal to the delimiter would end the value early, and the reason
            # can carry the agent's own words: drop any such line rather than trust it.
            if [ -f "${OUTPUT_DIR}/failure_reason.txt" ]; then grep -vFx 'FACTORY_HANDOFF_EOF' "${OUTPUT_DIR}/failure_reason.txt" || true; echo; fi
            echo "FACTORY_HANDOFF_EOF"
            if [ -f "${OUTPUT_DIR}/rate_limited.txt" ]; then echo "rate_limited=true"; else echo "rate_limited=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Always remove the accounts file
        if: always()
        run: rm -f "${RUNNER_TEMP}/factory-accounts.json"

      - name: Remove in-progress
        # Only on the way out clean: on a failure the `retry` job owns the label and drops it
        # itself, a step before it relabels, so the PR is never unlabelled while that job spends
        # minutes starting up on a fresh runner (#51). Same shape as agent-implement.yml.
        if: github.event.pull_request.state == 'open'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true

  retry:
    # The failure handler is a job, not a step of `implement-pr` (#51), for the same reason
    # as on the ticket path: a `timeout-minutes` kill cancels that job, so `failure()` is
    # false and a step gated on it never ran, leaving the PR with no label and no comment.
    # See agent-implement.yml's `retry` job for why widening that condition is not the fix.
    # One informed retry, then needs-human (#16), for a failure of the implementer itself.
    # FACTORY_PAT so the label that starts the retry fires its event. A failure elsewhere in
    # the implement-PR job (a push refused because the branch moved, say), or a handler that
    # cannot reach GitHub, gets the plain blocked comment.
    needs: implement-pr
    if: always() && needs.implement-pr.outputs.handle == 'true' && needs.implement-pr.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # the linked ticket and its labels
      pull-requests: write
      actions: read # the handler links the uploaded run log (#16)

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Reading-key alias for the rename (#282): the handler's checks and Actions reads use it
      # once retry is wired to the module (#284); GH_TOKEN, the old name, is kept until #288.
      READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install factory (pinned sandcastle, tsx, Claude Code)
        working-directory: factory
        run: npm ci

      - name: Rebuild the failing attempt's output
        # The handler reads the attempt's output from OUTPUT_DIR, which died with the
        # implement-PR job's runner. The reason and the rate-limit marker come back from that
        # job's outputs, the run log from the artifact it uploaded.
        env:
          FAILURE_REASON: ${{ needs.implement-pr.outputs.reason }}
          RATE_LIMITED: ${{ needs.implement-pr.outputs.rate_limited }}
        run: |
          set -euo pipefail
          # runner.temp is not available in job-level env, so OUTPUT_DIR is set here for the steps after this one.
          out="${RUNNER_TEMP}/factory-out"
          echo "OUTPUT_DIR=$out" >> "$GITHUB_ENV"
          mkdir -p "$out"
          if [ -n "$FAILURE_REASON" ]; then printf '%s\n' "$FAILURE_REASON" > "$out/failure_reason.txt"; fi
          if [ "$RATE_LIMITED" = "true" ]; then printf 'every account was rate limited\n' > "$out/rate_limited.txt"; fi

      - name: Download the run log
        # Absent when the kill landed before the upload; the handler reports what it has.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: factory-implement-pr-${{ github.event.pull_request.number }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out/logs

      - name: Remove in-progress
        # The implement-PR job left it on for a failed attempt so the PR was never unlabelled
        # while this job started up. It comes off here, a step before the relabel. A handler that
        # never got this far leaves it on, and the reconciler's stuck sweep repairs that (#51).
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true

      - name: Retry or escalate
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          FAILURE_KIND: implement
          ARTIFACT_NAME: factory-implement-pr-${{ github.event.pull_request.number }}-run-${{ github.run_attempt }}
          IMPLEMENTER_OUTCOME: ${{ needs.implement-pr.outputs.outcome }}
        run: |
          if factory/node_modules/.bin/tsx factory/factory/retry/retry.ts; then
            exit 0
          fi
          reason="(no reason file written; check workflow logs)"
          if [ -f "${OUTPUT_DIR}/failure_reason.txt" ]; then
            reason=$(cat "${OUTPUT_DIR}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` PR run failed outside the implementer, or the retry handler could not run.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"
