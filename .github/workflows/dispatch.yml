# Reusable: the dispatcher and the reconciler. Moves tickets labeled
# ready-for-agent with no open blockers, no assignee, and no factory state into
# the factory by adding agent:implement. On every sweep (`factory-sweep`
# repository_dispatch, workflow_dispatch) it also repairs states stuck past
# their deadline (#35): a ticket or PR whose label never got its run, an
# auto-merge PR with no verdict, a merge-ready PR left behind main. Called
# from a target repo's thin factory workflow on
# `issues: [closed, labeled, unassigned, unlabeled]`, workflow_dispatch, and
# `repository_dispatch: [factory-sweep]`.
#
# The caller admits an `unassigned` event whoever dropped the assignee, and an
# `unlabeled` event for any label outside the factory's own agent:* and factory:*
# namespaces, so a ticket stopped by hold, needs-human or an assignee is
# dispatched the moment the human lets go of it rather than on the next
# heartbeat. Every one of those clauses, and the `labeled` one, is admitted on
# an open ticket only (#213 for the two removals, #236 for the two labels going
# on). A close is admitted whatever the state.
# The two namespace clauses are a loop breaker, not a refinement: the
# factory writes labels with a PAT so they fire their events, and its own removals
# used to wake a sweep that re-stamped the ticket, so a cancelled run got a
# replacement within seconds (#170). Why the caller still does not try to name
# which of the admitted removals matter, and the one factory write that still wakes
# a sweep: docs/factory/dispatcher.md.
#
# A heartbeat outside GitHub drives the sweep. GitHub's own cron was removed
# from the caller in #270: measured on one private target it fired 6 times
# against about 129 expected in 21 and a half hours, and a seven hour gap was
# seen, so it was never a reliable fallback. The daily recheck (#267) retries a
# repair that changed nothing, so a deadline missed during an outage is caught
# without the cron. The heartbeat runs on the interval factory/heartbeat/interval.ts
# names, with a PAT that has contents: write on the targets and nothing else.
# The sender and its one target list live in this repo (#222):
# add the target to factory/heartbeat/targets.ts, then run
# GH_TOKEN=<token> node --experimental-strip-types factory/heartbeat/send.ts
name: factory dispatch

on:
  workflow_call:
    inputs:
      factory_repo:
        description: Repo holding the factory scripts (this repo).
        type: string
        default: chizhangucb/tomte
      factory_ref:
        description: Ref of the factory scripts to run. Keep it equal to the ref in the caller's `uses:`; GitHub does not expose that ref to the called workflow.
        type: string
        default: main
      trusted_author_associations:
        description: >-
          Comma-separated GitHub author_association values whose tickets the factory will run
          (OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR, NONE). A ticket body is the implementer's
          instructions, and on a public target anyone can open an issue, so the default is the
          repo owner alone. Empty falls back to the default.
        type: string
        default: OWNER
      stuck_minutes:
        description: Reconciler deadline. A ticket in agent:implement or agent:in-progress, or a PR in agent:review, agent:implement, or agent:in-progress, with no live run for this long is re-labeled; a second miss escalates to needs-human.
        type: number
        default: 15
      verdict_minutes:
        description: Reconciler deadline. A factory PR with auto-merge armed, or any other non-draft, non-fork PR closing a trusted ticket, with no factory/verdict on its head for this long gets agent:review.
        type: number
        default: 30
      update_minutes:
        description: Reconciler deadline. A PR with a passing verdict that is behind main, with no update-branch run in this long, gets a factory-update-branch dispatch.
        type: number
        default: 30
    secrets:
      FACTORY_PAT:
        description: Personal access token that adds the labels and sends dispatches. GITHUB_TOKEN must not be used for those; a label it adds fires no labeled event, so the implementer never starts. The reconciler reads Actions runs and commit statuses with GITHUB_TOKEN, which a fine-grained PAT cannot.
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One dispatcher at a time per repo so two runs never race on the same ticket.
    # GitHub keeps one running plus one pending run per group and cancels older
    # pending ones; safe for the dispatch step, every run is a full scan, so the
    # newest run sees everything the cancelled ones would have. It costs the
    # reconcile step below, which issue-event runs skip: GitHub cancels the
    # older pending run every time a newer one queues, so a pending sweep is
    # displaced for as long as issue events keep arriving faster than a run
    # takes, not for one interval. At the label churn one ticket makes, a few
    # events over its whole life, that is an interval or two against deadlines
    # of 15 to 30 minutes, so the next sweep still finds the stranding. A bulk
    # label edit across many tickets is the case that could outlast them.
    concurrency:
      group: factory-dispatch
      cancel-in-progress: false
    permissions:
      actions: read # reconciler: the run list and job names
      statuses: read # reconciler: factory/verdict on auto-merge PR heads

    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false
          sparse-checkout: |
            factory/dispatch
            factory/lib/errors.ts
            factory/lib/factory-pr.ts
            factory/lib/gh.ts
            factory/lib/labels.ts
            factory/lib/linked-issue.ts
            factory/lib/target-repo.ts
            factory/lib/trusted-authors.ts
            factory/lib/verdict.ts
            factory/retry/escalation.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dispatch ready tickets
        # No npm install: the script is builtins only and runs on strip-types.
        env:
          GH_REPO: ${{ github.repository }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          TRUSTED_AUTHOR_ASSOCIATIONS: ${{ inputs.trusted_author_associations }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
        run: node --experimental-strip-types factory/factory/dispatch/dispatch-run.ts

      - name: Reconcile stuck states
        # The sweep proper (#35): one logged decision per candidate, repairs with FACTORY_PAT so the
        # labels fire their events. Not on issue events: those runs are the event path itself, and
        # every sweep is a full scan, so the next one covers whatever they would have found.
        if: ${{ !cancelled() && github.event_name != 'issues' }}
        env:
          GH_REPO: ${{ github.repository }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          STUCK_MINUTES: ${{ inputs.stuck_minutes }}
          VERDICT_MINUTES: ${{ inputs.verdict_minutes }}
          UPDATE_MINUTES: ${{ inputs.update_minutes }}
          # Whose ticket a PR that is not a factory PR may close and still be labelled for a verdict (#182).
          TRUSTED_AUTHOR_ASSOCIATIONS: ${{ inputs.trusted_author_associations }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
        run: node --experimental-strip-types factory/factory/dispatch/sweep-run.ts

      - name: Upload decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out/*.json
          if-no-files-found: ignore
