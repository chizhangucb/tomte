# Reusable: run the reviewer on a PR labeled agent:review.
# Called from a target repo's thin factory workflow on `pull_request_target: labeled`.
# Vendored from sandcastle's agent-review.yml (v0.12.0), edited for the factory:
# the reviewer is read-only (no push, no mark-ready), ticks the ticket's acceptance
# criteria into the PR body, and sets the factory/verdict commit status.
name: Agent Review

on:
  workflow_call:
    inputs:
      reviewer_model:
        description: Model for the reviewer.
        type: string
        default: claude-opus-5
      test_command:
        description: The target's test command, run on the PR head before the reviewer; its output is evidence for the verdict.
        type: string
        default: npm ci && npm run typecheck --if-present && npm test
      checks_timeout_minutes:
        description: How long the retry handler waits after the verdict for the head's merge gate and CI to settle; a check still pending then is requeued, not failed.
        type: number
        default: 15
      trusted_author_associations:
        description: >-
          Comma-separated GitHub author_association values whose words the factory acts on
          (OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR, NONE). PR comments, review threads and the linked ticket's comments from anyone else are dropped
          before the reviewer reads them, with a count in their place.
          Keep it equal to the dispatch and implement jobs; setting it widens all of it together.
          Empty falls back to OWNER; a payload with no association reads as NONE.
        type: string
        default: OWNER
      node_version:
        description: The Node the target's own tests and tooling run on. Match the target's own CI.
        type: string
        default: "22"
      factory_repo:
        description: Repo holding the factory scripts (this repo).
        type: string
        default: chizhangucb/tomte
      factory_ref:
        description: Ref of the factory scripts to run. Keep it equal to the ref in the caller's `uses:`; GitHub does not expose that ref to the called workflow.
        type: string
        default: main
    secrets:
      FACTORY_PAT:
        required: true

jobs:
  refuse-fork:
    # pull_request_target runs with secrets: the factory never runs a fork's code. Say so on the PR
    # and drop the trigger label, instead of skipping in silence. No story asked for this job; it
    # stays because reverting it would open the hole, not close a rewrite (#47).
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LABEL: agent:review
    steps:
      - run: |
          gh pr edit "$PR_NUMBER" --remove-label "$LABEL" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run: the factory does not run on PRs from forks (\`$LABEL\` removed). Push the branch to this repo instead."

  review:
    # pull_request_target runs with secrets: never on a fork's code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Keyed on the subject, this run's PR, and the role is not part of the key, so
      # an implement-pr run never edits a branch this run is reading (#149).
      # Unrelated subjects never share a key, so nothing waits behind a run it has
      # nothing to do with, and the older run is never cancelled: it is doing real
      # work. ADR 0004's 2026-09-10 amendment carries the reasoning and trade-off.
      group: factory-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read # the linked ticket and its acceptance criteria
      pull-requests: write
      statuses: write
      checks: read # the retry handler reads the head's check runs (#16)
      actions: read # and the failing runs' logs and artifacts

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Transition labels
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Mark verdict pending
        # Needs statuses: write from the caller (see templates/factory.yml); a caller without it
        # gets a warning here and a hard failure at "Set verdict status".
        run: |
          gh api --method POST "repos/${GH_REPO}/statuses/${BRANCH_HEAD_SHA}" \
            -f state=pending -f context=factory/verdict \
            -f description="reviewer running" -f target_url="$RUN_URL" --silent \
            || echo "::warning::Could not set factory/verdict to pending. Does the caller grant statuses: write?"

      - name: Enumerate accounts
        # One secret per account, CLAUDE_CODE_OAUTH_TOKEN_<n>, labeled by the CLAUDE_ACCOUNT_<n> variable.
        # Every token is masked before anything else prints. The list goes to a file in RUNNER_TEMP for
        # the run script, which picks the account, deletes the file, and rotates once on a rate limit
        # (#17). Adding an account is adding one secret; nothing here changes.
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$")) | .value' <<<"$SECRETS_JSON" \
            | while IFS= read -r token; do echo "::add-mask::$token"; done
          file="${RUNNER_TEMP}/factory-accounts.json"
          jq -n --argjson secrets "$SECRETS_JSON" --argjson vars "$VARS_JSON" '
            [ $secrets | to_entries[]
              | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$"))
              | (.key | sub("^CLAUDE_CODE_OAUTH_TOKEN_"; "") | tonumber) as $n
              | ($vars["CLAUDE_ACCOUNT_\($n)"] // "") as $label
              | { index: $n, label: (if ($label | length) > 0 then $label else "account-\($n)" end), token: .value } ]
            | sort_by(.index)' > "$file"
          chmod 600 "$file"
          count=$(jq 'length' "$file")
          if [ "$count" = "0" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN_<n> secret is available. Pass secrets: inherit from the caller." >&2
            exit 1
          fi
          echo "FACTORY_ACCOUNTS_FILE=$file" >> "$GITHUB_ENV"
          echo "$count account(s) configured: $(jq -r '[.[] | "\(.index)"] | join(", ")' "$file")"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Prepare branch
        working-directory: target
        run: |
          # fetch-depth 0 already brought origin/main; no credentials remain for a network fetch
          git branch -f main origin/main
          git checkout -B "$BRANCH" "$BRANCH_HEAD_SHA"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Run target tests
        # Evidence for the reviewer, never a merge gate: the job goes on whatever the exit status.
        # The PR's own scripts run here, so no token is in reach.
        working-directory: target
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""
        run: |
          mkdir -p "$RUNNER_TEMP/factory-out"
          set +e
          timeout 20m bash -o pipefail -c "$TEST_COMMAND" > "$RUNNER_TEMP/factory-out/test-output.txt" 2>&1
          status=$?
          set -e
          printf '\n[test command exited with status %s]\n' "$status" >> "$RUNNER_TEMP/factory-out/test-output.txt"
          echo "Test command exited $status; $(wc -c < "$RUNNER_TEMP/factory-out/test-output.txt" | tr -d ' ') bytes captured."
          tail -n 40 "$RUNNER_TEMP/factory-out/test-output.txt"

      - name: Install factory (pinned sandcastle, tsx, Claude Code)
        # One step for his three: the CLI is pinned in the factory's lockfile, not `npm i -g` (#21).
        working-directory: factory
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "Claude Code $(node_modules/.bin/claude --version)"

      - name: Run review agent
        # Read-only: the script fails the run on any commit, dirty file, or moved HEAD.
        working-directory: target
        env:
          REVIEWER_MODEL: ${{ inputs.reviewer_model }}
          TRUSTED_AUTHOR_ASSOCIATIONS: ${{ inputs.trusted_author_associations }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
          TEST_OUTPUT_FILE: ${{ runner.temp }}/factory-out/test-output.txt
        run: tsx ../factory/factory/agent-workflows/review/review.ts

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-review-pr-${{ github.event.pull_request.number }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out/logs
          if-no-files-found: ignore

      - name: Post usage comment
        # Token usage and wall time of every attempt in this job, one comment per role (#18).
        if: always()
        run: bash factory/factory/lib/upsert-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/factory-out/usage-reviewer.md"

      - name: Write verdict into the PR body
        if: success()
        run: gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/factory-out/pr_body.md"

      - name: Post PR review
        if: success()
        env:
          PAYLOAD: ${{ runner.temp }}/factory-out/review_payload.json
        run: gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/reviews" --input "$PAYLOAD"

      - name: Post thread replies
        if: success()
        env:
          REPLIES: ${{ runner.temp }}/factory-out/replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Set verdict status
        # Always lands: a reviewer that crashed, or a job that failed after the
        # verdict was written, is a failing verdict, never a green one.
        id: verdict
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ] && [ -f "$RUNNER_TEMP/factory-out/verdict.txt" ]; then
            state=$(cat "$RUNNER_TEMP/factory-out/verdict.txt")
            description=$(cat "$RUNNER_TEMP/factory-out/verdict-description.txt")
          else
            state=failure
            description="reviewer run failed, see the run"
          fi
          gh api --method POST "repos/${GH_REPO}/statuses/${BRANCH_HEAD_SHA}" \
            -f state="$state" -f context=factory/verdict \
            -f description="$description" -f target_url="$RUN_URL" --silent
          echo "factory/verdict on ${BRANCH_HEAD_SHA}: $state ($description)"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Trigger update-branch on a passing verdict
        # The head may have fallen behind main while the reviewer ran; the caller's
        # update-branch job brings it up to date so auto-merge can fire (#14). A
        # repository_dispatch with FACTORY_PAT, because GITHUB_TOKEN fires no event and
        # the fine-grained PAT cannot write statuses (so a status event was not an option).
        if: steps.verdict.outputs.state == 'success'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          gh api --method POST "repos/${GH_REPO}/dispatches" \
            -f event_type=factory-update-branch -F "client_payload[pr]=${PR_NUMBER}" --silent
          echo "Dispatched factory-update-branch for PR #${PR_NUMBER}."

      - name: Requeue or mark blocked on failure
        # The review side's own failure labelling, separate from the retry handler below
        # and reached where that handler is not: a reviewer that crashed, or that never
        # got an account. A run rate limited on every account is not this PR's failure
        # (#148), so it is requeued the way the handler requeues a ticket: the requeue
        # comment, no `agent:blocked`, and the PR left in `agent:in-progress` for the
        # reconciler, which re-adds the start label at its stuck deadline. Two files say
        # so: rate_limited.txt, written by the run script (RATE_LIMITED_FILE in
        # factory/lib/accounts.ts) and meaning every account was rate limited, is read
        # here; requeued.txt (REQUEUED_FILE in factory/retry/decide.ts) is written here
        # for the step that would otherwise take `agent:in-progress` off on the way out.
        # A renderer that cannot write the comment falls through to the blocked path,
        # because a PR with neither comment nor label is the one outcome to avoid. Any
        # other failure keeps `agent:blocked`, which has one meaning: a human must look.
        if: failure()
        run: |
          out="${RUNNER_TEMP}/factory-out"
          body_file="${RUNNER_TEMP}/failure-comment.md"
          if [ -f "$out/rate_limited.txt" ] && tsx factory/factory/retry/requeue-comment.ts > "$body_file"; then
            : > "$out/requeued.txt"
            gh pr comment "$PR_NUMBER" --body-file "$body_file"
            echo "Every account was rate limited: PR #${PR_NUMBER} requeued, left in agent:in-progress."
            exit 0
          fi
          reason="(no reason file written; check workflow logs)"
          if [ -f "$out/failure_reason.txt" ]; then
            reason=$(cat "$out/failure_reason.txt")
          fi
          printf '`agent:review` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:review` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Retry or escalate on a failing verdict or merge gate
        # The one place PR-side failures are judged (#16): once the verdict is posted, wait for the
        # head's merge gate statuses and the target's own CI to settle, then on any failure give the
        # implementer one informed retry (implement-pr on this branch, agent:implement on the PR)
        # or escalate the ticket. FACTORY_PAT so the labels fire events. A crashed reviewer is
        # not the implementer's failure and keeps the blocked comment above; so does a handler
        # that cannot reach GitHub, so the PR never sits with no label and no comment.
        # Reads with GITHUB_TOKEN (checks: read, actions: read), writes with FACTORY_PAT.
        if: success()
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          # The module's reading key (#282, #288): the handler's labels and PR reads go through it.
          # The checks wait's own reads still ride the job's inherited GH_TOKEN through the shared `gh`, not the module's keys.
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_KIND: checks
          CHECKS_TIMEOUT_MINUTES: ${{ inputs.checks_timeout_minutes }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_NAME: factory-review-pr-${{ github.event.pull_request.number }}-run-${{ github.run_attempt }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
        run: |
          if tsx factory/factory/retry/retry-run.ts; then
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body "The retry handler failed after the verdict was posted; see ${RUN_URL}. Re-add \`agent:review\` to judge this head again."
          exit 1

      - name: Always remove the accounts file
        if: always()
        run: rm -f "${RUNNER_TEMP}/factory-accounts.json"

      - name: Always remove in-progress
        # Unless the run was requeued (#148). A requeued PR is left in `agent:in-progress`
        # on purpose: that is the label the reconciler sweeps, so it is what gets the
        # start label re-added at the stuck deadline. Taking it off would leave the PR
        # with no `agent:*` label, which nothing sweeps, and no `agent:blocked` either,
        # so the PR would be lost rather than requeued. requeued.txt is written by
        # whichever path requeued it: the step above on a rate limit, the retry handler
        # (factory/retry/retry-run.ts, REQUEUED_FILE) on a head whose checks never settled.
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/factory-out/requeued.txt" ]; then
            echo "PR #${PR_NUMBER} was requeued: agent:in-progress stays on for the reconciler."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
