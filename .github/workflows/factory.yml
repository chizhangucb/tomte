# Copy to .github/workflows/factory.yml in the target repo. This is the only factory file a target carries.
# factory_ref must equal the ref in each `uses:` (the scripts are checked out at factory_ref; GitHub does
# not tell a cross-repo reusable workflow which ref it came from). Change both together.
#
# Two keys, two settled names, handed in by `secrets: inherit`:
# - FACTORY_PAT: the writing key. The PAT you store as the FACTORY_PAT secret (README's onboarding step).
#   Writes go through it so a label the factory adds fires its event.
# - READ_TOKEN: the reading key, for the reads a fine-grained PAT cannot make (Actions runs, commit
#   statuses). Backed by the automatic GITHUB_TOKEN; you store nothing for it.
# The old names (GH_TOKEN for writes, STATUS_TOKEN and GH_TOKEN for reads) were dropped by the
# contract ticket (#288), so a target must hand in these two names.
name: factory

on:
  issues:
    # unlabeled and unassigned: a ticket held back by hold or by an
    # assignee reaches the factory the moment the human removes the blocker,
    # instead of waiting for the next heartbeat. Which of those removals the
    # dispatcher actually answers is its own condition's job, below: the
    # factory's own removals are dropped there, and so is any edit at all on a
    # closed ticket, a label going on included.
    types: [closed, labeled, unassigned, unlabeled]
  pull_request_target:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, closed] # closed: the first-20 audit on merged factory PRs
  merge_group:
    # The merge queue's candidate: the pull request rebased onto the latest main,
    # asking for the required checks just before it lands. Only merge-gate answers
    # it, and it runs the same job it runs on a pull request, so `factory/red-green`
    # and `factory/test-integrity` mean the same thing on both (#344). Harmless
    # until this repo's ruleset turns a queue on: GitHub sends the event to nobody
    # before that, so nothing here changes.
  push:
    branches: [main] # update-branch: bring stale auto-merge PRs up to date when main moves
  repository_dispatch:
    # factory-update-branch: sent by the review workflow on a passing verdict.
    # factory-sweep: the heartbeat, and what actually drives the sweep. Required, not optional.
    # Send it from outside GitHub on the interval factory/heartbeat/interval.ts names (that file
    # and the factory repo's README are the only places it is written down), with a token that has
    # contents write and issues and pull requests read on the targets and nothing else.
    # It is sent only when something is waiting here. One sender covers any number of targets,
    # from the factory repo:
    # add this repo to factory/heartbeat/targets.ts and run
    #   GH_TOKEN=<token> node --experimental-strip-types factory/heartbeat/send.ts
    types: [factory-update-branch, factory-sweep]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write # factory/verdict, factory/red-green, factory/test-integrity
  checks: read # retry handler: the head's check runs
  actions: read # retry handler: failing runs' logs and artifacts

jobs:
  # The pause. Set the repository variable FACTORY_PAUSED on this repo and the factory stops;
  # delete it and the factory carries on:
  #   gh variable set FACTORY_PAUSED --repo <owner>/<repo> --body "runaway sweep, see #123"
  #   gh variable delete FACTORY_PAUSED --repo <owner>/<repo>
  # The value is the reason, not a flag, so the repo says why it is paused rather than leaving
  # a reader to infer it from an absence of runs. Any non-empty value pauses, so a maintainer
  # who types "false" into it pauses the factory instead of arming a trap.
  #
  # Why a variable: `vars` is readable in a job's `if:` and `secrets` is not, and a variable
  # shows up in Settings, Secrets and variables, Actions, where someone looking at the repo
  # finds it without reading this file. FACTORY_PAT cannot write repo variables, so the factory
  # can never pause or resume itself.
  #
  # What it gates, job by job below: dispatch, implement, review, implement-pr and
  # update-branch, everything that starts work or moves it along. What it deliberately does
  # not gate: merge-gate and audit, the two that judge a pull request somebody else already
  # opened. A pause that took those down would silently drop factory/red-green and
  # factory/test-integrity from every PR opened while it was on. That is exactly what
  # `gh workflow disable factory.yml` does, and why disabling this file is the wrong breaker.
  # audit is not idle while paused, to be clear: it runs a model on each merged factory PR
  # inside its first-20 window and on a miss it opens a revert PR and a needs-human issue.
  # That is wanted. A bad merge that landed just before the pause is what you most want
  # caught while everything else is stopped.
  #
  # Nothing is queued while paused: a gated job's `if:` evaluates to false and the job is
  # skipped before a runner is assigned, so a resume starts nothing retroactively. The factory
  # picks up from the repo's state on the next heartbeat, the same state any sweep reads, so
  # fix what caused the pause before lifting it. A pause does not cancel a run already in
  # flight, and it is what makes `gh run cancel` stick: the retry handler's re-label lands on
  # a gated implement job and starts nothing. Pause first, cancel second.
  # docs/factory/pause.md has the rest, including what a pause does not do.
  paused:
    if: vars.FACTORY_PAUSED != ''
    runs-on: ubuntu-latest
    permissions: {} # it reads and writes nothing: the whole job is one echo
    steps:
      # The reason goes through the environment rather than into the script text, so whatever
      # is typed into the variable is data and never a command. The annotation shows its first
      # line only, which is GitHub's limit on one; the summary below shows all of it.
      - name: Say the factory is paused, and why
        env:
          REASON: ${{ vars.FACTORY_PAUSED }}
        run: |
          echo "::warning title=factory paused::$REASON"
          {
            echo "## The factory is paused on this repo"
            echo ""
            echo "Reason: $REASON"
            echo ""
            echo 'Still running: `merge-gate` and `audit`. Nothing else is.'
            echo 'Resume: `gh variable delete FACTORY_PAUSED --repo '"$GITHUB_REPOSITORY"'`'
          } >> "$GITHUB_STEP_SUMMARY"

  # An unlabeled event wakes the sweep for any label except the factory's own two
  # namespaces, agent:* and factory:*. Every label the factory writes goes in with
  # FACTORY_PAT so it fires its event, which is what lets adding agent:implement start
  # an implementer, and that cuts both ways: without the two clauses below a removal
  # the factory made woke a full sweep too. A run's cleanup takes its agent:* label
  # off, the sweep that removal woke found the ticket takeable again and re-stamped it,
  # and a cancelled run had a replacement within seconds. Twelve cancels on one target
  # went to fourteen runs in flight in two minutes (#170).
  # Every issues clause here is admitted on an open ticket only (#213 for the two removals,
  # #236 for the two labels going on). A close still wakes the sweep, because closing one
  # ticket can unblock another.
  # What still reaches the sweep, on purpose: a human dropping hold or
  # needs-human, a human dropping an assignee, and the factory's own
  # escalation dropping ready-for-agent. That last one labels nothing, because the label
  # whose removal woke the sweep is the first one the dispatcher checks for: it is
  # already off the ticket, so the sweep refuses it without waiting on any other write.
  # A ticket whose run was cancelled is no longer re-dispatched by the sweep at all. Two
  # bounded paths still bring it back, at most once each: the retry handler, which reads a
  # cancelled job as the implementer's own failure (#51) and spends the one retry, and the
  # reconciler, at its stuck deadline (stuck_minutes, default 30) on the next heartbeat.
  # Either way a second cancel parks the ticket on needs-human. Making a deliberate cancel
  # stay cancelled outright is #185, in the retry handler rather than here.
  dispatch:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'factory-sweep') ||
      (github.event_name == 'issues' && (github.event.action == 'closed' ||
        (github.event.action == 'unassigned' && github.event.issue.state != 'closed') ||
        (github.event.action == 'unlabeled' && github.event.issue.state != 'closed' &&
          !startsWith(github.event.label.name, 'agent:') &&
          !startsWith(github.event.label.name, 'factory:')) ||
        (github.event.action == 'labeled' && github.event.issue.state != 'closed' &&
          github.event.label.name == 'ready-for-agent'))))
    uses: chizhangucb/tomte/.github/workflows/dispatch.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # Optional: whose tickets run, by GitHub author_association (default OWNER).
      # A ticket body is what the implementer executes, and on a public repo anyone
      # can open an issue. Widen only to people who could already push.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
      # Optional: the reconciler's deadlines in minutes (defaults 30, 30, 30).
      # stuck_minutes: 30
      # verdict_minutes: 30
      # update_minutes: 30
  implement:
    if: >-
      vars.FACTORY_PAUSED == '' && github.event_name == 'issues' &&
      github.event.action == 'labeled' && github.event.issue.state != 'closed' &&
      github.event.label.name == 'agent:implement'
    uses: chizhangucb/tomte/.github/workflows/agent-implement.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # Optional, on implement, implement-pr, review, merge-gate and audit: the Node the target's
      # own tests and tooling need (default "22"). Set it on every one of those jobs.
      # node_version: "24"
      # Optional: whose words the implementer acts on. Keep it equal to the dispatch job's,
      # or a trusted author's ticket is dispatched and their comments are then dropped.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
  review:
    if: >-
      vars.FACTORY_PAUSED == '' && github.event_name == 'pull_request_target' &&
      github.event.label.name == 'agent:review'
    uses: chizhangucb/tomte/.github/workflows/agent-review.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # node_version: "24"
      # Optional: whose words the reviewer reads, on the PR and on the linked ticket.
      # Set it on every job that takes it (dispatch, implement, review, implement-pr,
      # audit), or the factory reads a stranger on one path and not another.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
  implement-pr:
    if: >-
      vars.FACTORY_PAUSED == '' && github.event_name == 'pull_request_target' &&
      github.event.label.name == 'agent:implement'
    uses: chizhangucb/tomte/.github/workflows/agent-implement-pr.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # node_version: "24"
      # Optional: whose words this run reads, the factory's own retry marker included.
      # Keep it equal to the implement job's, or a retry loses its failure context.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
  merge-gate:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      github.event_name == 'merge_group'
    uses: chizhangucb/tomte/.github/workflows/merge-gate.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # node_version: "24"
      # tomte's tests are TypeScript, run through tsx; the default "node --test" cannot load
      # them. This runs the one changed test file passed to it, from the target's root.
      test_command: node --import tsx --test
      # Optional: run once per checkout before the tests (default "npm ci", empty skips it).
      # Whatever a second kind of test needs installed belongs here rather than in
      # test_command, which runs once per changed test file.
      # install_command: <this target's install, plus anything its second kind of test needs>
  audit:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
    uses: chizhangucb/tomte/.github/workflows/agent-audit.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # node_version: "24"
      # Optional: whose words the audit reads, on the PR and on the linked ticket.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
      # Optional: the strongest model the subscription serves (see docs/factory/audit.md).
      # audit_model: claude-fable-5-1
  update-branch:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      (github.event_name == 'push' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'factory-update-branch'))
    uses: chizhangucb/tomte/.github/workflows/update-branch.yml@main
    secrets: inherit
    with:
      factory_ref: main
