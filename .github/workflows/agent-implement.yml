# Reusable: run the implementer on an issue labeled agent:implement.
# Called from a target repo's thin factory workflow on `issues: labeled`.
# Vendored from sandcastle's agent-implement.yml (v0.12.0), edited for the factory.
name: Agent Implement

on:
  workflow_call:
    inputs:
      implementer_model:
        description: Default model for the implementer. A model:<name> label on the issue overrides it for that run.
        type: string
        default: claude-opus-5
      trusted_author_associations:
        description: >-
          Comma-separated GitHub author_association values whose words the factory acts on
          (OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR, NONE). Comments on the ticket from anyone
          else are dropped before the implementer reads it. Keep it equal to the dispatch job's.
        type: string
        default: OWNER
      node_version:
        description: The Node the target's own tests and tooling run on. Match the target's own CI.
        type: string
        default: "22"
      factory_repo:
        description: Repo holding the factory scripts (this repo).
        type: string
        default: chizhangucb/tomte
      factory_ref:
        description: Ref of the factory scripts to run. Keep it equal to the ref in the caller's `uses:`; GitHub does not expose that ref to the called workflow.
        type: string
        default: main
    secrets:
      FACTORY_PAT:
        description: Personal access token used for pushes and PR creation so the target repo's CI fires.
        required: true
      # Account tokens are CLAUDE_CODE_OAUTH_TOKEN_<n>, discovered from the inherited secrets.

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Keyed on the subject, this run's ticket, so two runs on it never overlap and
      # two implementers never push the same branch at once (#149). Unrelated
      # subjects never share a key, so nothing waits behind a run it has nothing to
      # do with, and the older run is never cancelled: it is doing real work.
      # ADR 0004's 2026-09-10 amendment carries the reasoning and the trade-off.
      group: factory-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      # Everything the `retry` job needs from this one. That job runs on its own
      # runner, so nothing it reads is here for free (#51).
      handle: ${{ steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' }}
      branch: ${{ steps.branch.outputs.name }}
      outcome: ${{ steps.run.outcome }}
      reason: ${{ steps.handoff.outputs.reason }}
      rate_limited: ${{ steps.handoff.outputs.rate_limited }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read # the retry handler links the uploaded run log (#16)

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Push steps put FACTORY_PAT in front of it; the agent never sees the token.
      PUSH_URL: ${{ github.server_url }}/${{ github.repository }}.git

    steps:
      - name: Detect issue shape
        # A ticket is a sub-issue of its spec by design (ADR 0002), so being a
        # sub-issue is fine. Having sub-issues means the issue is a spec, refused.
        # A closed issue is refused too: the dispatcher labels from a snapshot,
        # and a ticket closed in between must not get a branch and a PR (#19).
        id: shape
        run: |
          set -euo pipefail
          state=$(gh issue view "$ISSUE_NUMBER" --json state --jq .state 2>/dev/null || echo "UNKNOWN")
          sub_count=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/sub_issues" --jq 'length' 2>/dev/null || echo "0")
          if [ "$state" != "OPEN" ] || [ "$sub_count" != "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "sub_count=$sub_count" >> "$GITHUB_OUTPUT"

      - name: Refuse closed issue
        if: steps.shape.outputs.state != 'OPEN'
        env:
          STATE: ${{ steps.shape.outputs.state }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          if [ "$STATE" = "UNKNOWN" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Refused to run: could not read issue #${ISSUE_NUMBER} (gh issue view failed). Re-add \`agent:implement\` to try again."
          else
            gh issue comment "$ISSUE_NUMBER" --body "Refused to run: issue #${ISSUE_NUMBER} is ${STATE}, not open. Reopen it and re-add \`agent:implement\` if it should be implemented."
          fi

      - name: Refuse PRD-shaped issue
        if: steps.shape.outputs.state == 'OPEN' && steps.shape.outputs.sub_count != '0'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: issue #${ISSUE_NUMBER} has sub-issues. The factory implements tickets, not specs."

      - name: Checkout factory
        if: steps.shape.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.shape.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Preflight existing PR
        # The same closing-keyword test as the reviewer, the merge gate, and the retry handler
        # (factory/lib/linked-issue.ts). Builtins only: runs before the engine is installed.
        if: steps.shape.outputs.proceed == 'true'
        id: preflight
        run: node --experimental-strip-types factory/factory/lib/preflight.ts

      - name: Refuse existing PR
        if: steps.preflight.outputs.refused == 'true'
        env:
          EXISTING_PR_URL: ${{ steps.preflight.outputs.existing_pr_url }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: $EXISTING_PR_URL already targets this issue. Close it first, then re-add \`agent:implement\`."

      - name: Transition labels
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Enumerate accounts
        # One secret per account, CLAUDE_CODE_OAUTH_TOKEN_<n>, labeled by the CLAUDE_ACCOUNT_<n> variable.
        # Every token is masked before anything else prints. The list goes to a file in RUNNER_TEMP for
        # the run script, which picks the account, deletes the file, and rotates once on a rate limit
        # (#17). Adding an account is adding one secret; nothing here changes.
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$")) | .value' <<<"$SECRETS_JSON" \
            | while IFS= read -r token; do echo "::add-mask::$token"; done
          file="${RUNNER_TEMP}/factory-accounts.json"
          jq -n --argjson secrets "$SECRETS_JSON" --argjson vars "$VARS_JSON" '
            [ $secrets | to_entries[]
              | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$"))
              | (.key | sub("^CLAUDE_CODE_OAUTH_TOKEN_"; "") | tonumber) as $n
              | ($vars["CLAUDE_ACCOUNT_\($n)"] // "") as $label
              | { index: $n, label: (if ($label | length) > 0 then $label else "account-\($n)" end), token: .value } ]
            | sort_by(.index)' > "$file"
          chmod 600 "$file"
          count=$(jq 'length' "$file")
          if [ "$count" = "0" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN_<n> secret is available. Pass secrets: inherit from the caller." >&2
            exit 1
          fi
          echo "FACTORY_ACCOUNTS_FILE=$file" >> "$GITHUB_ENV"
          echo "$count account(s) configured: $(jq -r '[.[] | "\(.index)"] | join(", ")' "$file")"

      - name: Checkout main
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Compute branch name
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        id: branch
        run: |
          slug=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          branch="agent/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        id: create
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          # A retry (#16) continues on the branch the failed attempt pushed. Any other run, a first
          # attempt or a ticket handed back after an escalation, starts from main.
          retrying=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name | select(startswith("factory:retry-"))] | length')
          if [ "$retrying" != "0" ] && git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -b "$BRANCH" "origin/$BRANCH"
            echo "resumed=true" >> "$GITHUB_OUTPUT"
            echo "Continuing on origin/$BRANCH, $(git rev-list --count main..HEAD) commit(s) ahead of main."
          else
            git checkout -b "$BRANCH"
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install factory (pinned sandcastle, tsx, Claude Code)
        # One step for his three: the CLI is pinned in the factory's lockfile, not `npm i -g` (#21).
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        working-directory: factory
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "Claude Code $(node_modules/.bin/claude --version)"

      - name: Run implementation agent
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        id: run
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          IMPLEMENTER_MODEL: ${{ inputs.implementer_model }}
          TRUSTED_AUTHOR_ASSOCIATIONS: ${{ inputs.trusted_author_associations }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tsx ../factory/factory/agent-workflows/implement/implement.ts

      - name: Upload run log
        if: always() && steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-implement-issue-${{ github.event.issue.number }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out/logs
          if-no-files-found: ignore

      - name: Push branch
        # refs/heads/$BRANCH, not HEAD: the branch the run collected commits on, whatever the agent left checked out.
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
        run: git push --force "https://x-access-token:${FACTORY_PAT}@${PUSH_URL#*://}" "refs/heads/$BRANCH:refs/heads/$BRANCH"

      - name: Open PR
        # Sandcastle calls this "Open draft PR" and #61 restores his step names, but not here:
        # not a draft, because GitHub refuses auto-merge on drafts (ADR 0003 amendment), and the
        # required factory/verdict status (absent until the reviewer posts it, failure on a fail)
        # is what holds the merge. His name over this step would say the opposite of what it does.
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        id: open_pr
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          title="${title:0:256}"
          body_file="${RUNNER_TEMP}/pr-body.md"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Implemented by the software factory. Run: ${RUN_URL}"
          } > "$body_file"
          pr_url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body_file" | tail -n1)
          echo "pr_number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url"

      - name: Enable auto-merge
        # No human in the merge path (ADR 0003). Squash, so update-branch's merge commits collapse.
        # Fires once every check the target's main ruleset requires, factory/verdict included, is
        # green on the head. A target whose main requires nothing refuses this ("clean status"):
        # run scripts/onboard.sh there. That refusal is reported on the PR, not fatal: the PR
        # exists and the preflight would refuse a retry, so the review must still run.
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          if out=$(gh pr merge "$PR_NUMBER" --auto --squash 2>&1); then
            gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '"auto-merge: " + (.autoMergeRequest.mergeMethod // "not enabled") + " by " + (.autoMergeRequest.enabledBy.login // "nobody")'
          else
            echo "::error::Could not enable auto-merge on PR #$PR_NUMBER: $out"
            gh pr comment "$PR_NUMBER" --body "Auto-merge could not be enabled: \`$out\`. Run \`scripts/onboard.sh\` on this repo, then \`gh pr merge $PR_NUMBER --auto --squash\`."
          fi

      - name: Request automated review
        # Sandcastle's AGENT_PAT-or-GITHUB_TOKEN fallback, with FACTORY_PAT for his AGENT_PAT.
        # FACTORY_PAT is declared required, but the caller passes `secrets: inherit`, which skips
        # that check, so an unset PAT arrives empty: hence the -n guard as well as the retry.
        # A label GITHUB_TOKEN applies fires no event on the target, so a review started that way
        # waits for the reconciler's sweep to re-apply it. The warning says so in the run log.
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -n "$FACTORY_PAT" ]; then
            GH_TOKEN="$FACTORY_PAT" gh pr edit "$PR_NUMBER" --add-label "agent:review"
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
          fi
          echo "::warning::agent:review applied with GITHUB_TOKEN: no event fires, the reconciler's sweep re-applies the label"
          GH_TOKEN="$GITHUB_TOKEN_FALLBACK" gh pr edit "$PR_NUMBER" --add-label "agent:review"

      - name: Post usage comment
        # Token usage and wall time of every attempt in this job, one comment per role (#18).
        if: always() && steps.open_pr.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
        run: bash factory/factory/lib/upsert-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/factory-out/usage-implementer.md"

      - name: Keep partial work on failure
        # The branch is what a retry continues on and what an escalation keeps for the human. A first
        # attempt that committed nothing deletes a stale origin branch left by an earlier cycle, so the
        # retry starts from main as its prompt says, instead of resuming work nobody in this cycle made.
        # always() && !success(): a `timeout-minutes` kill cancels the job, and failure() is
        # false for a cancelled job, so the retry would otherwise resume from main (#51).
        if: always() && !success() && steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && steps.branch.outputs.name != ''
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          RESUMED: ${{ steps.create.outputs.resumed }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
        run: |
          url="https://x-access-token:${FACTORY_PAT}@${PUSH_URL#*://}"
          if [ "$(git rev-list --count "main..refs/heads/$BRANCH" 2>/dev/null || echo 0)" = "0" ]; then
            if [ "$RESUMED" = "false" ] && git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              git push "$url" --delete "refs/heads/$BRANCH"
              echo "No commits on $BRANCH; deleted stale origin/$BRANCH from an earlier cycle so a retry starts from main."
            else
              echo "No commits on $BRANCH; nothing to keep."
            fi
          else
            git push --force "$url" "refs/heads/$BRANCH:refs/heads/$BRANCH"
            echo "Pushed $(git rev-list --count "main..refs/heads/$BRANCH") commit(s) to $BRANCH."
          fi

      - name: Collect the retry handoff
        # What the `retry` job cannot read off this runner: the failure reason the run wrote
        # and the marker that says every account was rate limited. The run log travels in the
        # uploaded artifact instead. always(), because a `timeout-minutes` kill cancels this
        # job and failure() would skip it (#51).
        if: always() && steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        id: handoff
        env:
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
        run: |
          set -euo pipefail
          {
            echo "reason<<FACTORY_HANDOFF_EOF"
            # A reason line equal to the delimiter would end the value early, and the reason
            # can carry the agent's own words: drop any such line rather than trust it.
            if [ -f "${OUTPUT_DIR}/failure_reason.txt" ]; then grep -vFx 'FACTORY_HANDOFF_EOF' "${OUTPUT_DIR}/failure_reason.txt" || true; echo; fi
            echo "FACTORY_HANDOFF_EOF"
            if [ -f "${OUTPUT_DIR}/rate_limited.txt" ]; then echo "rate_limited=true"; else echo "rate_limited=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Always remove the accounts file
        if: always()
        run: rm -f "${RUNNER_TEMP}/factory-accounts.json"

      - name: Remove in-progress
        # Only on the way out clean: on a failure the `retry` job owns the label and drops it
        # itself, once it is about to relabel. Dropping it here would leave the ticket with no
        # factory label for the minutes that job spends on a fresh runner, and the dispatcher's
        # sweep re-dispatches exactly that shape on its next pass: a `ready-for-agent` ticket
        # with no `agent:*` label and no open PR. That run would start before the retry comment
        # and the `factory:retry-1` label exist, so it would begin from main with no RETRY
        # section, which is the resume the handler is there to arrange (#51).
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true

  retry:
    # The failure handler is a job, not a step of `implement` (#51). A `timeout-minutes`
    # kill cancels that job, so `failure()` is false and a step gated on it never ran:
    # a stuck agent left the ticket for the reconciler's stuck sweep instead of for retry
    # and escalation. Widening that step to `always()` is not enough, because a cancelled
    # job runs its remaining steps only inside the runner's cancellation window; a job that
    # `needs` the killed one is scheduled after it and is not on that clock.
    # One informed retry, then needs-human (#16), for a failure of the implementer itself.
    # FACTORY_PAT so the label that starts the retry fires its event. A failure elsewhere
    # in the implement job (checkout, push, PR), or a handler that cannot reach GitHub,
    # gets the plain blocked comment instead of burning the retry.
    needs: implement
    if: always() && needs.implement.outputs.handle == 'true' && needs.implement.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read # the handler links the uploaded run log (#16)

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Reading-key alias for the rename (#282): the handler's checks and Actions reads use it
      # once retry is wired to the module (#284); GH_TOKEN, the old name, is kept until #288.
      READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install factory (pinned sandcastle, tsx, Claude Code)
        working-directory: factory
        run: npm ci

      - name: Rebuild the failing attempt's output
        # The handler reads the attempt's output from OUTPUT_DIR, which died with the
        # implement job's runner. The reason and the rate-limit marker come back from that
        # job's outputs, the run log from the artifact it uploaded.
        env:
          FAILURE_REASON: ${{ needs.implement.outputs.reason }}
          RATE_LIMITED: ${{ needs.implement.outputs.rate_limited }}
        run: |
          set -euo pipefail
          # runner.temp is not available in job-level env, so OUTPUT_DIR is set here for the steps after this one.
          out="${RUNNER_TEMP}/factory-out"
          echo "OUTPUT_DIR=$out" >> "$GITHUB_ENV"
          mkdir -p "$out"
          if [ -n "$FAILURE_REASON" ]; then printf '%s\n' "$FAILURE_REASON" > "$out/failure_reason.txt"; fi
          if [ "$RATE_LIMITED" = "true" ]; then printf 'every account was rate limited\n' > "$out/rate_limited.txt"; fi

      - name: Download the run log
        # Absent when the kill landed before the upload; the handler reports what it has.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: factory-implement-issue-${{ github.event.issue.number }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out/logs

      - name: Remove in-progress
        # The implement job left it on for a failed attempt so nothing re-dispatched the ticket
        # while this job started up. It comes off here, a step before the relabel. A handler that
        # never got this far leaves it on, and the reconciler's stuck sweep repairs that (#51).
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true

      - name: Retry or escalate
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          BRANCH: ${{ needs.implement.outputs.branch }}
          FAILURE_KIND: implement
          ARTIFACT_NAME: factory-implement-issue-${{ github.event.issue.number }}-run-${{ github.run_attempt }}
          IMPLEMENTER_OUTCOME: ${{ needs.implement.outputs.outcome }}
        run: |
          if factory/node_modules/.bin/tsx factory/factory/retry/retry-run.ts; then
            exit 0
          fi
          reason="(no reason file written; check workflow logs)"
          if [ -f "${OUTPUT_DIR}/failure_reason.txt" ]; then
            reason=$(cat "${OUTPUT_DIR}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` run failed outside the implementer, or the retry handler could not run.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"
